<!doctype html>
<!-- Chat demo hero - BrewedOps Motion Library, https://brewedops.cloud/motionlibrary/?id=hero-chat -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat demo hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2f5fa;
      }

      .frame {
        width: min(92vw, 560px);
        aspect-ratio: 4/3;
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          0 1px 2px rgba(16, 24, 40, 0.06),
          0 20px 50px rgba(16, 24, 40, 0.12);
      }

      .d {
        --ml-bg: #ffffff;
        --ml-surface: #f4f7fc;
        --ml-line: #e3e9f2;
        --ml-bar: #dce4f0;
        --ml-bar-2: #ebf0f7;
        --ml-ink: #1d1d1f;
        --ml-ink-2: #424245;
        --ml-muted: #66666b;
        --ml-accent: #0a6cff;
        --ml-accent-soft: #e7f0ff;
        --ml-grad: linear-gradient(135deg, #0a6cff 0%, #4fa3ff 100%);
        --ml-shadow:
          0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.08);
        --ml-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ml-bounce-dur: 594ms;
        --ml-font:
          "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          system-ui, sans-serif;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ml-bg);
        color: var(--ml-ink);
        font: 500 12px/1.35 var(--ml-font);
        -webkit-font-smoothing: antialiased;
      }

      .d *,
      .d *::before,
      .d *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .d button,
      .d input,
      .d select,
      .d textarea {
        font: inherit;
        color: inherit;
      }

      @supports (transition-timing-function: linear(0, 1)) {
        .d {
          --ml-bounce: linear(
            0,
            0.0833 5.6%,
            0.2603 11.1%,
            0.4566 16.7%,
            0.6331 22.2%,
            0.7737 27.8%,
            0.8759 33.3%,
            0.9442 38.9%,
            0.9858 44.4%,
            1.0081 50%,
            1.0178 55.6%,
            1.0199 61.1%,
            1.018 66.7%,
            1.0143 72.2%,
            1.0104 77.8%,
            1.007 83.3%,
            1.0043 88.9%,
            1.0023 94.4%,
            1 100%
          );
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .d *,
        .d *::before,
        .d *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Chat demo hero */
      .d {
        display: grid;
        place-items: center;
        background: var(--ml-surface);
      }

      .d .win {
        width: 88%;
        height: 88%;
        display: flex;
        flex-direction: column;
        background: var(--ml-bg);
        border-radius: 12px;
        box-shadow: var(--ml-shadow);
        overflow: hidden;
      }

      .d .bar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--ml-line);
        flex: none;
      }

      .d .bar i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ml-bar);
      }

      .d .bar .url {
        margin-left: 8px;
        width: 40%;
        height: 6px;
        border-radius: 3px;
        background: var(--ml-bar-2);
      }

      .d .pg {
        position: relative;
        flex: 1;
        overflow: hidden;
        background: var(--ml-bg);
      }

      .d .nv {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
      }

      .d .nv b {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--ml-accent);
      }

      .d .nv span {
        width: 14px;
        height: 4px;
        border-radius: 2px;
        background: var(--ml-bar);
      }

      .d .nv span:first-of-type {
        margin-left: auto;
      }

      .d .b {
        height: 5px;
        border-radius: 3px;
        background: var(--ml-bar);
      }

      .d .b.s {
        width: 40%;
      }

      .d .b.m {
        width: 66%;
      }

      .d .hd {
        font: 700 19px/1.08 var(--ml-font);
        letter-spacing: -0.035em;
        color: var(--ml-ink);
      }

      .d .ac {
        color: var(--ml-accent);
      }

      .d .c {
        position: absolute;
        inset: 0;
        padding: 22px 7% 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .d .c .hd {
        font-size: 13px;
        text-align: center;
      }

      .d .th {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        justify-content: flex-end;
        min-height: 0;
      }

      .d .m {
        display: flex;
        gap: 5px;
        max-width: 86%;
        opacity: 0;
        transform: translateY(8px) scale(0.9);
        transition:
          opacity 0.2s ease,
          transform var(--ml-bounce-dur) var(--ml-bounce);
      }

      .d .m.on {
        opacity: 1;
        transform: none;
      }

      .d .m.u {
        align-self: flex-end;
        transform-origin: 100% 100%;
      }

      .d .m.a {
        align-self: flex-start;
        transform-origin: 0 100%;
      }

      .d .m.u .tu {
        padding: 6px 9px;
        border-radius: 12px 12px 3px 12px;
        background: var(--ml-grad);
        color: #fff;
        font-size: 10px;
        font-weight: 500;
        display: block;
      }

      .d .m.a s {
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: 50%;
        background: var(--ml-accent-soft);
        color: var(--ml-accent);
        display: grid;
        place-items: center;
        margin-top: 2px;
      }

      .d .m.a s svg {
        width: 10px;
        height: 10px;
      }

      .d .bb {
        padding: 6px 9px;
        border-radius: 12px 12px 12px 3px;
        background: var(--ml-surface);
        border: 1px solid var(--ml-line);
        font-size: 10px;
        line-height: 1.35;
        color: var(--ml-ink-2);
        min-width: 34px;
      }

      .d .dts {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        height: 11px;
      }

      .d .dts[hidden] {
        display: none;
      }

      .d .dts u {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--ml-muted);
        animation: bn 1s ease-in-out infinite;
      }

      .d .dts u:nth-child(2) {
        animation-delay: 0.15s;
      }

      .d .dts u:nth-child(3) {
        animation-delay: 0.3s;
      }

      .d .inp {
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px 0 10px;
        border-radius: 999px;
        border: 1px solid var(--ml-line);
        background: var(--ml-bg);
        flex: none;
      }

      .d .inp span {
        width: 34%;
        height: 4px;
        border-radius: 2px;
        background: var(--ml-bar-2);
      }

      .d .inp i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ml-grad);
        color: #fff;
        display: grid;
        place-items: center;
      }

      .d .inp i svg {
        width: 9px;
        height: 9px;
      }

      @keyframes bn {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }

        30% {
          transform: translateY(-3px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="d">
        <div class="win">
          <div class="bar"><i></i><i></i><i></i><span class="url"></span></div>
          <div class="pg">
            <div class="nv"><b></b><span></span><span></span><span></span></div>
            <div class="c">
              <div class="hd">Ask <span class="ac">Nova</span> anything</div>
              <div class="th" role="log" aria-live="off">
                <div class="m u on">
                  <span class="tu">Plan my launch week</span>
                </div>
                <div class="m a on">
                  <s
                    ><svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"
                      /></svg
                  ></s>
                  <div class="bb">
                    <span class="ta"
                      >Done. Teaser Monday, demo Wednesday, ship Friday.</span
                    ><i class="dts" hidden><u></u><u></u><u></u></i>
                  </div>
                </div>
              </div>
              <div class="inp">
                <span></span
                ><i
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M5 12h14M12 5l7 7-7 7" /></svg
                ></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (matchMedia("(prefers-reduced-motion: reduce)").matches)
        document.querySelector(".d").dataset.paused = "1";

      ((root) => {})(document.querySelector(".d"));
    </script>
  </body>
</html>
